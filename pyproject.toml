[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signal-studio"
version = "0.1.0"
description = "A modular AI intelligence timeline and workspace agent."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11,<4",
  "fastapi>=0.116,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
agent = [
  "langchain-core>=0.3,<2",
]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]
addopts = "-ra"
