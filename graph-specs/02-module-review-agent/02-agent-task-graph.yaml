    - tests/modules/collection/test_web_discovery.py
    - tests/modules/agent_runtime/test_goal_plan_coverage.py
    - tests/api/test_agent_complex_turns.py
    - tests/modules/agent_assets/test_agent_assets_product.py
    - tests/modules/agent_runtime/test_context.py
    - apps/web/e2e/models.spec.ts
    - apps/web/e2e/agent-assets.spec.ts
    - apps/web/e2e/runs.spec.ts
    - tests/evals/agent/test_release_eval_harness.py
