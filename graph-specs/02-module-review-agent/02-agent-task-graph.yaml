id: agent_task_graph
version: 0.8.0
workflow_version: 0.8.0
status: target
feature_flag: agent.langgraph_runtime
schemas:
  input: AgentTurnInputV2
  state: AgentTaskStateV2
  output: AgentTurnResultV2
  state_schema_version: 1.2.0
  plan_schema_version: 1.2.0
  event_schema_version: 1.2.0
  context_contract_version: 1.4.0
runtime:
  framework: langgraph
  agent_framework: langchain
  provider_compatibility:
    core_contract: provider_agnostic
    default_profile: openai-compatible
    profiles:
      openai-compatible:
        structured_output_method: function_calling
      dashscope-openai-compatible:
        structured_output_method: function_calling
        extra_body:
          enable_thinking: false
    structured_output_repair:
      include_raw: true
      max_schema_attempts: 2
      unstructured_json_fallback: false
  model_connection_policy:
    mark_pending_on: [model_created, model_configuration_edited]
    explicit_test_on: [user_connection_test]
    mark_needs_retest_on: [suspected_provider_error]
    skip_on: [normal_model_selection, healthy_conversation_turn]
    states: [pending, healthy, needs_retest, error, not_applicable]
  checkpointer:
    local: sqlite
    path: data/agent-checkpoints.db
    multi_instance_future: postgresql
  thread_id: turn_id
  business_runs: references_in_state
compatibility:
  resume_requires_exact_workflow_version: true
  unknown_state_schema: fail_with_actionable_error
  checkpoint_migration: explicit_only
execution_manifest:
  fields:
    - workflow_version
    - state_schema_version
    - plan_schema_version
    - event_schema_version
    - base_prompt_version
    - domain_pack_versions
    - agent_pack_version
    - tool_catalog_version
    - model_config_ref
    - requested_model_id
    - effective_model_id
    - artifact_ids
    - capability_snapshot_digest
domain_catalog:
  version: 1.0.0
  packs:
    - collection
    - intelligence
    - tasking
    - sources
    - runs
    - review
    - cards
    - agent_assets
    - models
    - agent
  resolver:
    max_active_domains_per_step: 3
    max_tools_per_model_call: 8
    disabled_capabilities_hidden: true
    forged_disabled_calls_rejected: true
  workspace_customization:
    source: active_agent_pack
    rules: always_loaded_bounded
    skills: selected_by_step_domains
    max_selected_skills: 4
    disabled_skills_hidden: true
    unavailable_fallback: built-in-defaults
    fallback_event: context.customization.fallback
  planning_contracts:
    collection.run.start:
      kind: capability
      domain: collection
      side_effect: external
      risk: low
      acceptance_policy: capability_effect.v1
    intelligence.search:
      kind: capability
      domain: intelligence
      side_effect: read
      risk: low
      acceptance_policy: information_results.v1
    web.search.collect:
      kind: capability
      domain: collection
      side_effect: external
      risk: low
      acceptance_policy: capability_effect.v1
    intelligence.timeline.query:
      kind: capability
      domain: intelligence
      side_effect: read
      risk: low
      acceptance_policy: information_results.v1
    research.recommend:
      kind: domain_agent
      domain: intelligence
      side_effect: read
      risk: low
      acceptance_policy: information_results.v1
    research.trend_brief:
      kind: domain_agent
      domain: intelligence
      side_effect: read
      risk: low
      acceptance_policy: synthesis_grounded.v1
  server_owned_plan_fields:
    normalize_from_capability_contract:
      [domain, kind, side_effect, risk, acceptance_policy]
    normalize_from_goal:
      [lookback_hours, max_items, ranking_criterion]
    purpose:
      - prevent_model_defined_approval_policy
      - prevent_unknown_domain_context_loading
      - avoid_replanning_for_provider_field_aliases
  context_engineering:
    version: context-budget@1.0.0
    principles: [write, select, compress, isolate]
    stable_prefix:
      base_prompt_versioned: true
      deterministic_json_serialization: true
      dynamic_values_after_base: true
    working_memory:
      source: [persisted_plan, step_statuses, bounded_errors]
      model_authored_free_form_memory: false
      fields: [objective, active_step_id, todo, notes]
      raw_stack_traces: false
      recite_before_model_step: true
    compaction:
      trigger: serialized_payload_exceeds_layer_budget
      strategy: deterministic_bounded_json
      always_valid_json: true
      preserve: [ids, paths, urls, objective, status, error_code]
      destructive_context_purge: false
      optional_model_summarizer: deferred_until_eval_justifies_cost
    isolation:
      task_scratchpad_scope: turn
      conversation_scope: bounded_recent_messages_and_result_refs
      long_term_scope: agent_pack_and_artifact_capabilities
      completed_turn_behavior: discard_derived_scratchpad_keep_references
  reasoning_contract:
    kind: model_reasoning
    capability_id: null
    side_effect: read
    acceptance_policy: contextual_response.v1
    tools_optional: true
    allowed_basis: [conversation_context, tool_evidence, mixed]
    selected_model: effective_model_id
  research_analysis_contract:
    model_calls_per_turn: 1
    invalid_structured_output_retry_calls: 1
    selected_model: effective_model_id
    default_generated_language: zh-CN
    source_content_language: preserve
    recommendation_step: research.recommend
    trend_step: research.trend_brief
    shared_structured_output: ResearchAnalysisSynthesisV1
    provider_output_normalization:
      structured_payload_sources: [parsed, tool_calls.arguments, content_json]
      invalid_or_duplicate_recommendation_ids: ignore
      missing_recommendations: fill_from_bounded_capability_ranking
      invented_trend_citations: ground_to_selected_information_ids
      additional_model_calls: 0
    deterministic_degraded_result:
      preserve_capability_ranked_items: true
      explain_provider_error_in_chinese: true
      fabricate_information: false
  saved_evidence_backfill:
    exact_window_first: true
    activate_when_items_below_goal: true
    source: persisted_workspace_information
    disclose_requested_item_count: true
    disclose_effective_lookback_hours: true
    disclose_backfilled_information_ids: true
    never_relabel_background_as_exact_window: true
    empty_candidates:
      execute_both_steps: true
      fabricate_information: false
      step_outcome: partial
  unified_intelligence_retrieval:
    identity: intelligence_id
    scopes: [pending, intelligence, archived, cards]
    lexical_rank: sqlite_fts5_bm25
    short_query_fallback: substring_match
    rank_fusion:
      algorithm: reciprocal_rank_fusion
      k: 60
      rankings: [lexical, recency, priority, product_stage]
    near_duplicate_grouping:
      algorithm: unicode_trigram_simhash64
      max_hamming_distance: 3
    model_input: compact_top_candidates_only
  conditional_web_evidence:
    capability: web.search.collect
    activate_when: local_results_below_goal
    search_provider_adapter: provider_neutral
    configured_provider: brave
    pipeline:
      - structured_web_search
      - robots_and_safe_url_gate
      - bounded_page_crawl
      - ttl_cache
      - raw_item_normalization
      - intelligence_analysis_and_tags
      - unified_search_refresh
    external_content_untrusted: true
    full_page_body_in_graph_state: false
    missing_provider: partial_with_actionable_error
budgets:
  max_plan_steps: 5
  max_active_domains_per_step: 3
  max_tools_per_model_call: 8
  max_tool_calls_per_step: 12
  max_replans: 2
  max_parallel_read_steps: 3
  tool_result_inline_bytes: 8192
runtime_controls:
  turn_lease:
    enabled: true
    single_executor: true
  cancellation:
    checked_at: [N02, N10, N17, N18, N19]
    preserve_completed_results: true
  event_journal:
    persist_before_stream: true
    ordered_sequence: true
    resumable: true
  recovery:
    scan_on_startup: true
    states: [running, waiting_input, waiting_approval, stale]
  finalizer:
    always_runs: true
    releases_turn_lease: true
retry_profiles:
  transient:
    applies_to: [timeout, rate_limit, connection_error, provider_5xx]
    max_attempts: 2
    backoff: exponential_with_jitter
  validation_or_policy:
    applies_to: [invalid_input, schema_error, policy_denied, approval_rejected]
    max_attempts: 0
approval_token_contract:
  fields:
    - actor_id
    - workspace_id
    - turn_id
    - step_id
    - capability_id
    - input_digest
    - expires_at
    - single_use
    - consumed_at
  edit_invalidates_token: true
acceptance_policies:
  - information_results.v1
  - capability_effect.v1
  - artifact_created.v1
  - synthesis_grounded.v1
  - contextual_response.v1
planning_modes:
  direct:
    source: deterministic
    uses_llm_planner: false
  fast:
    source: structured_client_input
    uses_llm_planner: false
  dynamic:
    source: natural_language
    uses_llm_planner: true
nodes:
  - id: N01
    name: accept_turn
    owner: agent
  - id: N02
    name: supervise_run
    owner: agent_runtime
    responsibilities: [lease, idempotency, budget, cancellation, execution_manifest]
  - id: N03
    name: normalize_input
    owner: agent_runtime
    output: AgentGoalSpecV1
  - id: N04
    name: bootstrap_context
    owner: agent_runtime
    context_layers: [base, workspace_policy, conversation_window, prior_turn_refs, bounded_result_summaries, restorable_references, agent_pack, capability_snapshot, domain_index]
  - id: N05
    name: route_complexity
    owner: agent_runtime
  - id: N06
    name: build_fast_plan
    owner: agent_runtime
    implementation: deterministic
  - id: N07
    name: build_structured_plan
    owner: agent_runtime
    implementation: langchain_structured_output
    output: AgentPlanningOutputV1
  - id: N08
    name: validate_plan
    owner: agent_runtime
    validation: [dag, goal_coverage, time_window, item_limit, ranking, deliverables, capability_registry]
  - id: N09
    name: clarify_and_wait
    owner: agent_runtime
    implementation: langgraph_interrupt
  - id: N10
    name: schedule_ready_steps
    owner: agent_runtime
    implementation: langgraph_send
  - id: N11
    name: assemble_step_context_and_tools
    owner: agent_runtime
    context_layers: [base, workspace_policy, conversation, domain, task_step, working_memory, evidence, tool_schema]
    tool_loading: optional_for_model_reasoning
  - id: N12
    name: bind_action
    owner: agent_runtime
    output: ActionEnvelopeV2
    bindings: [query_time_window, candidate_ids_from_query, selected_ids_for_synthesis]
    bypass_when: model_reasoning
  - id: N13
    name: validate_action
    owner: module_domain
    implementation: pydantic_and_domain_validator
  - id: N14
    name: capability_policy_gate
    owner: capabilities
    bypass_when: validated_read_only_model_reasoning
  - id: N15
    name: approve_and_wait
    owner: capabilities
    implementation: langgraph_interrupt
  - id: N16
    name: route_executor
    owner: agent_runtime
    routes: [atomic_capability, bounded_domain_agent, model_reasoning, known_domain_workflow]
  - id: N17
    name: execute_capability
    owner: capabilities
  - id: N18
    name: execute_bounded_domain_agent
    owner: module_domain
    implementation: selected_model_reasoning_or_langchain_create_agent
    selected_model: effective_model_id
    outputs: [validated_tool_result, validated_model_response, shared_recommendation_and_trend_analysis]
  - id: N19
    name: execute_domain_workflow
    owner: module_domain
    implementation: langgraph_subgraph_or_parallel_map
  - id: N20
    name: record_event_evidence_artifact
    owner: agent_runtime
    persist_before_continue: true
    stream_projection: complete_validated_result_block
  - id: N21
    name: join_results
    owner: agent_runtime
    responsibilities: [deduplicate_information_ids, merge_evidence_refs, deduplicate_uncertainties, preserve_partial_results]
  - id: N22
    name: inspect_outcome
    owner: agent_runtime
    evaluation_order: [schema, resource_refs, acceptance_policy, optional_quality_judge]
    complete_requires: [goal_coverage, requested_item_count_or_explicit_gap, grounded_synthesis]
    recoverable_coverage_gap:
      statuses: [partial]
      continue_dependents: true
      applies_to: [empty_timeline, insufficient_candidates, empty_grounded_synthesis]
  - id: N23
    name: control_retry_replan_budget
    owner: agent_runtime
  - id: N24
    name: compose_result
    owner: agent
    always_emit: [result_summary]
    error_projection: localized_reason_and_retryability
  - id: N25
    name: finalize_outcome
    owner: agent_runtime
    terminal_statuses: [complete, partial, failed, cancelled]
edges:
  - [N01, N02]
  - [N02, N03]
  - [N03, N04]
  - [N04, N05]
  - from: N05
    to: N06
    when: direct_or_atomic
  - from: N05
    to: N07
    when: complex_or_ambiguous
  - [N06, N08]
  - [N07, N08]
  - from: N08
    to: N09
    when: missing_required_input
  - from: N09
    to: N05
    when: resumed
  - from: N08
    to: N10
    when: valid
  - from: N08
    to: N23
    when: invalid_or_repairable
  - from: N10
    to: N11
    when: ready_steps
  - from: N10
    to: N24
    when: cancel_requested
  - [N11, N12]
  - [N12, N13]
  - from: N13
    to: N23
    when: invalid
  - from: N13
    to: N14
    when: valid
  - from: N14
    to: N16
    when: allowed
  - from: N14
    to: N15
    when: approval_required
  - from: N14
    to: N20
    when: denied
  - from: N15
    to: N12
    when: approved_or_edited
  - from: N15
    to: N20
    when: rejected
  - from: N16
    to: N17
    when: atomic_capability
  - from: N16
    to: N18
    when: bounded_agentic_step_or_model_reasoning
  - from: N16
    to: N19
    when: known_domain_workflow
  - [N17, N20]
  - [N18, N20]
  - [N19, N20]
  - [N20, N21]
  - [N21, N22]
  - from: N22
    to: N10
    when: next_runnable_steps
  - from: N22
    to: N23
    when: repairable
  - from: N22
    to: N09
    when: user_input_required
  - from: N22
    to: N24
    when: finish
  - from: N23
    to: N16
    when: retry_action
  - from: N23
    to: N12
    when: rebind
  - from: N23
    to: N07
    when: replan
  - from: N23
    to: N24
    when: budget_exhausted
  - [N24, N25]
interrupt_nodes: [N09, N15]
waiting_status_projection:
  N09: waiting_input
  N15: waiting_approval
checkpoint_after: [N04, N08, N09, N15, N17, N18, N19, N20, N21, N24, N25]
side_effect_nodes: [N17, N18, N19]
idempotency:
  capability_step_key: turn_id + step_id + capability_id + canonical_input_digest
  model_reasoning_step: no_external_side_effect
artifacts:
  graph_state_contains_references_only: true
  large_result_storage: business_store_or_artifact_store
stream:
  projection: AgentTurnEventV2
  ordered_sequence: true
  resumable: true
  analysis_events: [model.research.started, model.research.completed, step.outcome]
security:
  external_evidence_untrusted: true
  capability_gate_is_authoritative: true
  secrets_in_model_context: false
  hidden_reasoning_persisted: false
observability:
  local_trace_sink_required: true
  langsmith_optional: true
  opentelemetry_exporter_optional: true
degraded_mode:
  deterministic_ui_and_rest_actions_available: true
  natural_language_agent_success_must_not_be_simulated: true
documentation:
  blueprint: docs/02-module-review-agent/02-05-final-agent-engineering-blueprint.md
  context_design: docs/02-module-review-agent/02-03-agent-context-engineering-and-workflows.md
  history: docs/02-module-review-agent/02-04-agent-workflow-history.md
  tasks: docs/07-delivery/07-04-optimization-implementation-status.md
  figma: https://www.figma.com/board/dF7TcDtCd3J96E0Bb0F5Ad
implementation_sync:
